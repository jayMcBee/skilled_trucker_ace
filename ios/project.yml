# XcodeGen spec. `brew install xcodegen && cd ios && xcodegen` writes CrazySkilledTrucker.xcodeproj.
name: CrazySkilledTrucker
options:
  bundleIdPrefix: com.janbarnholt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  CrazySkilledTrucker:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Skilled Trucker Ace
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RigTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests
    dependencies:
      - target: CrazySkilledTrucker
